name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Architectural invariants first: cheap, and they fail loudest.
  discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Layering, framework-independence, platform-fencing
        run: python3 tools/ci/check_layering.py
      - name: Verification runner invariants
        run: |
          python3 tools/ci/test_protocol_deps.py
          python3 tools/ci/test_autobahn_runner.py
          python3 tools/ci/test_h3_interop.py
          python3 tools/ci/test_h3_soak_runner.py

  # Every backend gets a real build and a real test run, because a platform
  # that merely compiles is not a supported platform:
  #
  #   ubuntu  → epoll
  #   macos   → kqueue
  #   windows → IOCP
  #
  # C++23 is the baseline; Result<T> uses std::expected on every platform.
  build:
    needs: discipline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  std: 23, backend: epoll }
          # Linux clang is a separate matrix entry: clang-18's __cpp_concepts
          # stays at 201907L, which makes libstdc++ hide std::expected behind
          # its feature-test gate even in C++23 mode. clang-19 is the first
          # release where the concepts macro matches the language mode, so it
          # is the oldest clang this library promises on Linux.
          - { os: ubuntu-latest,  std: 23, backend: epoll-clang, cc: clang-19, cxx: clang++-19 }
          - { os: macos-latest,   std: 23, backend: kqueue }
          - { os: windows-latest, std: 23, backend: iocp }
    name: ${{ matrix.backend }} / c++${{ matrix.std }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install clang
        if: matrix.cxx
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cc }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=${{ matrix.std }}
      - name: Build
        run: cmake --build build --parallel --config Debug
      - name: Test
        run: ctest --no-tests=error --test-dir build --output-on-failure --build-config Debug
      - name: Installed package consumer
        run: python tools/ci/check_install_consumer.py --build-dir build --config Debug

  # TLS is an opt-in module. Keep the dependency-free matrix above as well.
  tls:
    needs: discipline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        std: [23]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install OpenSSL on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Locate OpenSSL on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          brew list mosquitto >/dev/null 2>&1 || brew install mosquitto
          echo "MIRA_REQUIRE_MOSQUITTO=1" >> "$GITHUB_ENV"
      - name: Install OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows nghttp2:x64-windows zlib:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build pinned Windows QUIC and HTTP3 dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $openssl = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          "OPENSSL_ROOT_DIR=$openssl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          @("$openssl/debug/bin", "$openssl/bin", "$openssl/tools/openssl") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          python tools/ci/build_protocol_deps.py --openssl-root "$openssl" --config Debug --architecture x64 --toolchain "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/build/protocol-deps/prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MIRA_PLATFORM_PROTOCOL_FLAGS=-DMIRA_ENABLE_HTTP2=ON -DMIRA_ENABLE_HTTP3=ON" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build independent HTTP3 curl on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/ci/build_interop_curl.py --openssl-root "$env:OPENSSL_ROOT_DIR" --config Debug --architecture x64 --toolchain "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE/build/interop-curl/prefix/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure TLS
        run: cmake -S . -B build/tls -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=${{ matrix.std }} -DMIRA_ENABLE_TLS=ON -DMIRA_ENABLE_WEBSOCKET=ON ${{ env.MIRA_PLATFORM_PROTOCOL_FLAGS }}
      - name: Build TLS
        run: cmake --build build/tls --parallel --config Debug
      - name: Test TLS and HTTPS
        run: ctest --no-tests=error --test-dir build/tls --output-on-failure --build-config Debug
      - name: Require independent Windows HTTP3 and Retry interoperability
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $curl = "$env:GITHUB_WORKSPACE/build/interop-curl/prefix/bin/curl.exe"
          python tools/ci/check_h3_interop.py build/tls/Debug/mira_h3_server.exe --strict --curl "$curl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci/check_h3_interop.py build/tls/Debug/mira_h3_multi_server.exe --multi-retry --strict --curl "$curl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installed TLS package and dependency isolation
        run: python tools/ci/check_install_consumer.py --build-dir build/tls --config Debug

  # Windows is not one toolchain. MSVC covers the IOCP backend above, and the
  # tls job builds it there too — but MinGW GCC is a supported local
  # toolchain, and both gaps that shipped in 0.4.0 (the resolver's empty
  # gai_strerrorA diagnostics; a coroutine conditional that stalls under
  # GCC 15) were invisible to MSVC. One UCRT64 job keeps the GCC lowering
  # honest, on exactly the stack the Windows-side verification runs.
  mingw:
    needs: discipline
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the UCRT64 toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-nghttp2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
      - name: Build pinned MinGW QUIC and HTTP3 dependencies
        run: python tools/ci/build_protocol_deps.py --path build/mingw-protocol-deps --openssl-root "$MINGW_PREFIX" --generator Ninja --config Debug
      - name: Configure with TLS and HTTP3
        run: cmake -S . -B build/mingw -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMIRA_ENABLE_TLS=ON -DMIRA_ENABLE_WEBSOCKET=ON -DMIRA_ENABLE_HTTP2=ON -DMIRA_ENABLE_HTTP3=ON -DOPENSSL_ROOT_DIR="$MINGW_PREFIX" -DCMAKE_PREFIX_PATH="$PWD/build/mingw-protocol-deps/prefix"
      - name: Build
        run: cmake --build build/mingw --parallel
      - name: Test
        run: ctest --no-tests=error --test-dir build/mingw --output-on-failure

  # Coroutine frame lifetime is the easiest thing here to get subtly wrong and
  # the hardest to notice without a sanitizer. The event loop raises the
  # stakes: frames are resumed from inside the loop, long after the call that
  # created them returned.
  sanitizers:
    needs: discipline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc-14, cxx: g++-14 }
          - { os: macos-latest, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install OpenSSL on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-14 libssl-dev zlib1g-dev
      - name: Locate OpenSSL on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          brew list mosquitto >/dev/null 2>&1 || brew install mosquitto
          echo "MIRA_REQUIRE_MOSQUITTO=1" >> "$GITHUB_ENV"
      - name: Build hash-verified OpenSSL for QUIC on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
          echo '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl.tar.gz' | sha256sum --check --strict
          tar xzf openssl.tar.gz
          cd openssl-3.5.9
          ./Configure --prefix="$RUNNER_TEMP/openssl35" --libdir=lib no-shared no-tests
          make -j"$(nproc)"
          make install_sw
          echo "OPENSSL_ROOT_DIR=$RUNNER_TEMP/openssl35" >> "$GITHUB_ENV"
      - name: Build instrumented protocol dependencies in an isolated prefix
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: >
          python3 tools/ci/build_protocol_deps.py --openssl-root "$OPENSSL_ROOT_DIR"
          --path build/asan-protocol-deps --config Debug
      - name: Configure all protocols with ASan and UBSan
        run: >
          cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug
          -DMIRA_ENABLE_TLS=ON -DMIRA_ENABLE_WEBSOCKET=ON
          -DMIRA_ENABLE_HTTP2=ON -DMIRA_ENABLE_HTTP3=ON
          -DCMAKE_PREFIX_PATH="$PWD/build/asan-protocol-deps/prefix"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build/asan --parallel
      - name: Test
        run: ctest --no-tests=error --test-dir build/asan --output-on-failure

  # The negative space of the parsers gets explored continuously, not just
  # when a maintainer remembers to run the fuzzer. A short, capped smoke pass
  # on Linux: enough to catch regressions the unit suite's shapes miss, cheap
  # enough to keep in the required path.
  fuzz:
    needs: discipline
    runs-on: ubuntu-latest
    env:
      CC: clang-19
      CXX: clang++-19
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install clang 19
        # clang-19 minimum on Linux (see the epoll-clang entry in build). No
        # -stdlib=libc++: LLVM 19's libc++ still hides std::stop_token behind
        # _LIBCPP_HAS_NO_EXPERIMENTAL_STOP_TOKEN (CI-proven with both 18 and
        # 19; the android job describes the same gate), while libstdc++ ships
        # the complete library — exactly what epoll-clang already validates.
        run: sudo apt-get update && sudo apt-get install -y clang-19 libssl-dev zlib1g-dev
      - name: Build hash-verified OpenSSL for QUIC fuzzing
        run: |
          curl -fsSL -o openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
          echo '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl.tar.gz' | sha256sum --check --strict
          tar xzf openssl.tar.gz
          cd openssl-3.5.9
          ./Configure --prefix="$RUNNER_TEMP/openssl35" --libdir=lib no-shared no-tests
          make -j"$(nproc)"
          make install_sw
          echo "OPENSSL_ROOT_DIR=$RUNNER_TEMP/openssl35" >> "$GITHUB_ENV"
      - name: Build protocol dependencies with sanitizer and fuzz coverage
        # Instrument HPACK, QPACK and QUIC internals as well as Mira's wrappers.
        # Link flags also apply to upstream CMake's compiler and symbol probes.
        env:
          CFLAGS: -fsanitize=address,undefined,fuzzer-no-link -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined,fuzzer-no-link -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined,fuzzer-no-link
        run: >
          python3 tools/ci/build_protocol_deps.py --openssl-root "$OPENSSL_ROOT_DIR"
          --path build/fuzz-protocol-deps --config Debug
      - name: Configure with libFuzzer
        run: >
          cmake -S . -B build/fuzz -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-19
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
          -DMIRA_BUILD_FUZZERS=ON -DMIRA_ENABLE_WEBSOCKET=ON
          -DMIRA_ENABLE_HTTP2=ON -DMIRA_ENABLE_HTTP3=ON
          -DCMAKE_PREFIX_PATH="$PWD/build/fuzz-protocol-deps/prefix"
      - name: Build
        run: cmake --build build/fuzz --parallel
      - name: Ordinary tests with instrumented parser libraries
        run: ctest --no-tests=error --test-dir build/fuzz --output-on-failure
      - name: Smoke fuzz (60s cap per harness)
        run: >
          ./build/fuzz/fuzz/fuzz_http_parser
          -max_total_time=60 -max_len=1024 -rss_limit_mb=2560
          fuzz/corpus/http_parser &&
          ./build/fuzz/fuzz/fuzz_response_parser
          -max_total_time=60 -max_len=1024 -rss_limit_mb=2560
          fuzz/corpus/response_parser &&
          ./build/fuzz/fuzz/fuzz_ws_parser
          -max_total_time=60 -max_len=8192 -rss_limit_mb=2560 &&
          ./build/fuzz/fuzz/fuzz_ws_handshake
          -max_total_time=60 -max_len=16384 -rss_limit_mb=2560 &&
          ./build/fuzz/fuzz/fuzz_ws_compression
          -max_total_time=60 -max_len=4096 -rss_limit_mb=2560 &&
          ./build/fuzz/fuzz/fuzz_mqtt_packet
          -max_total_time=60 -max_len=4096 -rss_limit_mb=2560 &&
          ./build/fuzz/fuzz/fuzz_socks_handshake
          -max_total_time=60 -max_len=4096 -rss_limit_mb=2560 &&
          ./build/fuzz/fuzz/fuzz_dns_message
          -max_total_time=60 -max_len=4096 -rss_limit_mb=2560 &&
          ./build/fuzz/fuzz/fuzz_http2_session
          -max_total_time=60 -max_len=16384 -rss_limit_mb=2560 fuzz/corpus/http2_session &&
          ./build/fuzz/fuzz/fuzz_http3_engine
          -max_total_time=60 -max_len=8192 -rss_limit_mb=2560 fuzz/corpus/http3_engine

  # Run the official RFC6455 and RFC7692 corpus against both roles.
  websocket-conformance:
    needs: discipline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install WebSocket build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Configure and build both conformance harnesses
        run: |
          cmake -S . -B build/autobahn -DCMAKE_BUILD_TYPE=Release -DMIRA_ENABLE_WEBSOCKET=ON
          cmake --build build/autobahn --parallel --target mira_ws_autobahn_server mira_ws_autobahn_client
      - name: Run official Autobahn client and server cases
        run: >
          python3 tools/ci/run_autobahn.py
          --server build/autobahn/mira_ws_autobahn_server
          --client build/autobahn/mira_ws_autobahn_client
          --runtime docker --compression --fail-non-strict --output build/autobahn-results --timeout 2400
      - name: Preserve complete conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: websocket-autobahn-results
          path: build/autobahn-results
          if-no-files-found: error

  # Optional protocol engines (nghttp2 / ngtcp2 / nghttp3) with their
  # dependencies built from pinned, hash-verified sources by the same
  # script a developer would run locally. This job covers POSIX; the TLS
  # and MinGW jobs above exercise the Windows H2/H3 dependency builds.
  protocols:
    needs: discipline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install protocol toolchain on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev g++-14 mosquitto
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          # mqtt.interop must reach the third-party broker, not skip it.
          echo "MIRA_REQUIRE_MOSQUITTO=1" >> "$GITHUB_ENV"
      - name: Build OpenSSL 3.5 for QUIC (Linux)
        if: runner.os == 'Linux'
        # The distro OpenSSL (3.0) predates SSL_set_quic_tls_cbs, which the
        # ngtcp2 ossl adapter requires. Build a private 3.5 copy for the
        # protocol dependencies; the core/TLS matrix above keeps using the
        # system OpenSSL. 3.5.1 also fixes x509 -addreject, which the QUIC
        # trust-purpose regression fixture requires (broken in 3.5.0).
        run: |
          set -eux
          curl -fsSL -o openssl.tar.gz \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
          echo "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl.tar.gz" | sha256sum --check --strict
          tar xzf openssl.tar.gz
          cd openssl-3.5.9
          ./Configure --prefix="$RUNNER_TEMP/openssl35" --libdir=lib no-shared no-tests
          make -j"$(nproc)"
          make install_sw
          echo "OPENSSL_ROOT_DIR=$RUNNER_TEMP/openssl35" >> "$GITHUB_ENV"
      - name: Locate OpenSSL on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          brew list mosquitto >/dev/null 2>&1 || brew install mosquitto
          echo "MIRA_REQUIRE_MOSQUITTO=1" >> "$GITHUB_ENV"
      - name: Build pinned protocol dependencies
        run: python3 tools/ci/build_protocol_deps.py --openssl-root "$OPENSSL_ROOT_DIR"
      - name: Build independent HTTP3 curl (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 tools/ci/build_interop_curl.py --openssl-root "$OPENSSL_ROOT_DIR"
          echo "$PWD/build/interop-curl/prefix/bin" >> "$GITHUB_PATH"
      - name: Configure with TLS, HTTP/2 and HTTP/3
        shell: bash
        run: >
          cmake -S . -B build/protocols -DCMAKE_BUILD_TYPE=Debug
          -DMIRA_ENABLE_TLS=ON -DMIRA_ENABLE_WEBSOCKET=ON
          -DMIRA_ENABLE_HTTP2=ON
          -DMIRA_ENABLE_HTTP3=ON -DMIRA_BUILD_BENCH=ON
          -DCMAKE_PREFIX_PATH="$PWD/build/protocol-deps/prefix"
          -DCMAKE_INSTALL_INCLUDEDIR=include/Mira-0.5
      - name: Build
        run: cmake --build build/protocols --parallel
      - name: Report external HTTP/3 interoperability capability
        shell: bash
        run: |
          curl --version
          if ! curl --version | grep -q 'HTTP3'; then
            echo '::warning::curl lacks HTTP3; external H3 interoperability is skipped (CTest code 77), not passed.'
            echo 'External HTTP/3 interoperability: SKIPPED (curl lacks HTTP3). Native Mira client/server tests still run.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Test POSIX protocols (Windows H2/H3 are not runtime-validated here)
        run: ctest --no-tests=error --test-dir build/protocols --output-on-failure
      - name: Require independent HTTP3 interoperability (Linux)
        if: runner.os == 'Linux'
        run: >
          python3 tools/ci/check_h3_interop.py build/protocols/mira_h3_server
          --strict --curl "$PWD/build/interop-curl/prefix/bin/curl"
          --openssl "$OPENSSL_ROOT_DIR/bin/openssl"
      - name: Require independent Retry interoperability (Linux)
        if: runner.os == 'Linux'
        run: >
          python3 tools/ci/check_h3_interop.py build/protocols/mira_h3_multi_server
          --strict --multi-retry --curl "$PWD/build/interop-curl/prefix/bin/curl"
          --openssl "$OPENSSL_ROOT_DIR/bin/openssl"
      - name: Real UDP Retry and network-fault smoke
        run: >
          python3 tools/bench/run_h3_soak.py --binary build/protocols/bench/bench_h3_soak
          --certificate build/protocols/modules/quic/tests/cert.pem
          --key build/protocols/modules/quic/tests/key.pem
          --duration-seconds 20 --seed 20260928 --clients 3 --requests 4
          --output build/h3-fault-smoke.json
      - name: Preserve fault-smoke measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h3-fault-smoke-${{ matrix.os }}
          path: build/h3-fault-smoke.json
          if-no-files-found: warn
      - name: Installed protocol package and component isolation
        run: python3 tools/ci/check_install_consumer.py --build-dir build/protocols
      - name: Configure HTTP3 without HTTP2 or NGHTTP2 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: >
          cmake -S . -B build/http3-only -DCMAKE_BUILD_TYPE=Debug
          -DMIRA_ENABLE_HTTP3=ON -DMIRA_ENABLE_HTTP2=OFF -DMIRA_ENABLE_TLS=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_NGHTTP2=TRUE
          -DCMAKE_PREFIX_PATH="$PWD/build/protocol-deps/prefix"
      - name: Build and test HTTP3-only (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build/http3-only --parallel
          ctest --no-tests=error --test-dir build/http3-only --output-on-failure
          python3 tools/ci/check_install_consumer.py --build-dir build/http3-only --expect-http3-only

  # Mobile targets cross-compile only; no runner executes them. Keeping them in
  # CI catches the usual breakage — a POSIX assumption that does not hold on a
  # sandboxed platform — without pretending the tests ran.
  ios:
    needs: discipline
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure for iOS
        run: >
          cmake -S . -B build/ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64
          -DMIRA_BUILD_TESTS=OFF
      - name: Build all non-TLS libraries (no target OpenSSL configured)
        run: cmake --build build/ios --config Debug

  android:
    needs: discipline
    runs-on: ubuntu-latest
    env:
      # Pinned rather than `$ANDROID_NDK_ROOT`, which is whichever NDK the
      # runner image happens to default to. `std::stop_token` is gated behind
      # `_LIBCPP_HAS_NO_EXPERIMENTAL_STOP_TOKEN` in the libc++ that NDK 27 and
      # 28 ship (LLVM 18 and 19); LLVM 20 removed the gate. So the default NDK
      # cannot build this library at any API level, and the version is a real
      # requirement rather than an incidental detail.
      MIRA_NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned NDK
        run: >
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          --install "ndk;$MIRA_NDK_VERSION"
      - name: Configure with NDK
        run: >
          cmake -S . -B build/android
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/$MIRA_NDK_VERSION/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
          -DMIRA_BUILD_TESTS=OFF
      - name: Build all non-TLS libraries (no target OpenSSL configured)
        run: cmake --build build/android --parallel
