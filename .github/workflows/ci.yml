name: ci

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORGEDEPS_HOME: ${{ github.workspace }}/../forgedeps

jobs:
  # Keep the validated Linux toolchain stable when ubuntu-latest changes its OS.
  # Architectural invariants first: cheap, and they fail loudest.
  discipline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install forgedeps
        run: |
          python3 -m pip install --break-system-packages -r requirements-build.txt
          python3 -m forgedeps init "${{ env.FORGEDEPS_HOME }}"
      - name: Layering, framework-independence, platform-fencing
        run: python3 scripts/ci/check_layering.py
      - name: Verification runner invariants
        run: |
          python3 scripts/ci/test_protocol_deps.py
          python3 scripts/ci/test_autobahn_runner.py
          python3 scripts/ci/test_h3_interop.py
          python3 scripts/ci/test_h3_soak_runner.py
          python3 scripts/ci/test_tcp_tls_early.py

  # Every backend gets a real build and a real test run, because a platform
  # that merely compiles is not a supported platform:
  #
  #   ubuntu  → epoll
  #   macos   → kqueue
  #   windows → IOCP
  #
  # C++23 is the baseline; Result<T> uses std::expected on every platform.
  build:
    needs: discipline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,  std: 23, backend: epoll }
          # Linux clang is a separate matrix entry: clang-18's __cpp_concepts
          # stays at 201907L, which makes libstdc++ hide std::expected behind
          # its feature-test gate even in C++23 mode. clang-19 is the first
          # release where the concepts macro matches the language mode, so it
          # is the oldest clang this library promises on Linux.
          - { os: ubuntu-24.04,  std: 23, backend: epoll-clang, cc: clang-19, cxx: clang++-19 }
          - { os: macos-latest,   std: 23, backend: kqueue }
          - { os: windows-latest, std: 23, backend: iocp }
    name: ${{ matrix.backend }} / c++${{ matrix.std }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install forgedeps
        run: |
          python -m pip install --break-system-packages -r requirements-build.txt
          python -m forgedeps init "${{ env.FORGEDEPS_HOME }}"
      - name: Install clang
        if: matrix.cxx
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cc }}
      - name: Configure
        run: cmake -S . -B build ${{ runner.os == 'Windows' && '-DCMAKE_CONFIGURATION_TYPES=Debug -DMIRA_DEPENDENCY_CONFIGURATION=Debug' || '-DCMAKE_BUILD_TYPE=Debug' }} -DCMAKE_CXX_STANDARD=${{ matrix.std }}
      - name: Build
        run: cmake --build build --parallel --config Debug
      - name: Test
        run: ctest --no-tests=error --test-dir build --output-on-failure --build-config Debug
      - name: Installed package consumer
        run: python scripts/ci/check_install_consumer.py --build-dir build --config Debug

  # The matrix above builds Windows Debug only, so MSVC Release-only
  # issues slip through: UCRT headers define _CrtSetReportMode and
  # _CrtSetReportFile as argument-discarding macros outside _DEBUG,
  # which tripped C4189 under /WX in Release (fixed by guarding the
  # loop with _DEBUG). Keep one Windows Release job so that class of
  # bug is caught by CI instead of by a downstream Windows build.
  windows-release:
    needs: discipline
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install forgedeps
        run: |
          python -m pip install --break-system-packages -r requirements-build.txt
          python -m forgedeps init "${{ env.FORGEDEPS_HOME }}"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CONFIGURATION_TYPES=Release -DCMAKE_CXX_STANDARD=23
      - name: Build
        run: cmake --build build --parallel --config Release
      - name: Test
        run: ctest --no-tests=error --test-dir build --output-on-failure --build-config Release

  # TLS is an opt-in module. Keep the dependency-free matrix above as well.
  tls:
    needs: discipline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        std: [23]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install forgedeps
        run: |
          python -m pip install --break-system-packages -r requirements-build.txt
          python -m forgedeps init "${{ env.FORGEDEPS_HOME }}"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install OpenSSL on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Locate OpenSSL on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          brew list mosquitto >/dev/null 2>&1 || brew install mosquitto
          echo "MIRA_REQUIRE_MOSQUITTO=1" >> "$GITHUB_ENV"
      - name: Install the independent OpenSSL command-line tool on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install openssl --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:/Program Files/OpenSSL-Win64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure TLS
        run: python scripts/ci/dependency_session.py -- cmake -S . -B build/tls ${{ runner.os == 'Windows' && '-DCMAKE_CONFIGURATION_TYPES=Debug -DMIRA_DEPENDENCY_CONFIGURATION=Debug' || '-DCMAKE_BUILD_TYPE=Debug' }} -DCMAKE_CXX_STANDARD=${{ matrix.std }} -DMIRA_ENABLE_TLS=ON -DMIRA_ENABLE_WEBSOCKET=ON -DMIRA_ENABLE_DNSSEC=ON ${{ runner.os == 'Windows' && '-DMIRA_ENABLE_HTTP2=ON -DMIRA_ENABLE_HTTP3=ON' || '' }}
      - name: Build TLS
        run: python scripts/ci/dependency_session.py -- cmake --build build/tls --parallel --config Debug
      - name: Build the independent HTTP3 curl artifact on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/ci/build_interop_curl.py --environment build/tls/forgedeps-environment.json
      - name: Test TLS and HTTPS
        run: python scripts/ci/dependency_session.py -- ctest --no-tests=error --test-dir build/tls --output-on-failure --build-config Debug
      - name: Require independent Windows HTTP3 and Retry interoperability
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $curl = (Get-Content build/interop-curl/binary.txt).Trim()
          python scripts/ci/dependency_session.py --environment build/tls/forgedeps-environment.json --environment build/interop-curl/environment.json -- python scripts/ci/check_h3_interop.py build/tls/Debug/mira_h3_server.exe --strict --curl "$curl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/dependency_session.py --environment build/tls/forgedeps-environment.json --environment build/interop-curl/environment.json -- python scripts/ci/check_h3_interop.py build/tls/Debug/mira_h3_multi_server.exe --multi-retry --strict --curl "$curl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installed TLS package and dependency isolation
        run: python scripts/ci/dependency_session.py -- python scripts/ci/check_install_consumer.py --build-dir build/tls --config Debug

  # Windows is not one toolchain. MSVC covers the IOCP backend above, and the
  # tls job builds it there too — but MinGW GCC is a supported local
  # toolchain, and both gaps that shipped in 0.4.0 (the resolver's empty
  # gai_strerrorA diagnostics; a coroutine conditional that stalls under
  # GCC 15) were invisible to MSVC. One UCRT64 job keeps the GCC lowering
  # honest, on exactly the stack the Windows-side verification runs.
  mingw:
    needs: discipline
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the UCRT64 toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-nghttp2
            mingw-w64-ucrt-x86_64-zlib
      - name: Select the supported Python for the MinGW shell
        # The MSYS2 UCRT64 interpreter lags the supported version, so drive the
        # tooling with the interpreter installed by setup-python instead.
        run: echo "MIRA_PYTHON=$(cygpath -u "$pythonLocation")/python.exe" >> "$GITHUB_ENV"
      - name: Install forgedeps into the selected Python
        run: |
          $MIRA_PYTHON -m pip install --break-system-packages -r requirements-build.txt
          $MIRA_PYTHON -m forgedeps init "${{ env.FORGEDEPS_HOME }}"
      - name: Configure with TLS and HTTP3
        run: $MIRA_PYTHON scripts/ci/dependency_session.py -- cmake -S . -B build/mingw -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMIRA_ENABLE_TLS=ON -DMIRA_ENABLE_WEBSOCKET=ON -DMIRA_ENABLE_DNSSEC=ON -DMIRA_ENABLE_HTTP2=ON -DMIRA_ENABLE_HTTP3=ON
      - name: Build
        run: $MIRA_PYTHON scripts/ci/dependency_session.py -- cmake --build build/mingw --parallel
      - name: Test
        run: $MIRA_PYTHON scripts/ci/dependency_session.py -- ctest --no-tests=error --test-dir build/mingw --output-on-failure

  # Coroutine frame lifetime is the easiest thing here to get subtly wrong and
  # the hardest to notice without a sanitizer. The event loop raises the
  # stakes: frames are resumed from inside the loop, long after the call that
  # created them returned.
  sanitizers:
    needs: discipline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc-14, cxx: g++-14 }
          - { os: macos-latest, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install forgedeps
        run: |
          python3 -m pip install --break-system-packages -r requirements-build.txt
          python3 -m forgedeps init "${{ env.FORGEDEPS_HOME }}"
      - name: Install OpenSSL on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-14 libssl-dev zlib1g-dev
      - name: Locate OpenSSL on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          brew list mosquitto >/dev/null 2>&1 || brew install mosquitto
          echo "MIRA_REQUIRE_MOSQUITTO=1" >> "$GITHUB_ENV"
      - name: Configure all protocols with ASan and UBSan
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: >
          python scripts/ci/dependency_session.py -- cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug
          -DMIRA_ENABLE_TLS=ON -DMIRA_ENABLE_WEBSOCKET=ON -DMIRA_ENABLE_DNSSEC=ON
          -DMIRA_ENABLE_HTTP2=ON -DMIRA_ENABLE_HTTP3=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: python scripts/ci/dependency_session.py -- cmake --build build/asan --parallel
      - name: Test
        run: python scripts/ci/dependency_session.py -- ctest --no-tests=error --test-dir build/asan --output-on-failure

  # Validate shared budgets, executor handoff and resolver coordination with
  # a race detector, separately from address/undefined instrumentation.
  thread-sanitizer:
    needs: discipline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install compiler on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang-19
      - name: Configure race detection
        shell: bash
        run: >
          cmake -S . -B build/tsan -DCMAKE_BUILD_TYPE=Debug -DMIRA_BUILD_EXAMPLES=OFF
          ${{ runner.os == 'Linux' && '-DCMAKE_CXX_COMPILER=clang++-19' || '' }}
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
      - name: Build focused concurrency tests
        run: cmake --build build/tsan --parallel --target mira_core_tests mira_runtime_tests mira_observe_tests mira_task_scope_tests mira_resolver_tests
      - name: Run focused concurrency tests
        run: ctest --test-dir build/tsan --no-tests=error --output-on-failure -R '^(core|runtime|observe|task_scope|resolver)$'

  # The negative space of the parsers gets explored continuously, not just
  # when a maintainer remembers to run the fuzzer. A short, capped smoke pass
  # on Linux: enough to catch regressions the unit suite's shapes miss, cheap
  # enough to keep in the required path.
  fuzz:
    needs: discipline
    runs-on: ubuntu-24.04
    env:
      CC: clang-19
      CXX: clang++-19
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install forgedeps
        run: |
          python3 -m pip install --break-system-packages -r requirements-build.txt
          python3 -m forgedeps init "${{ env.FORGEDEPS_HOME }}"
      - name: Install clang 19
        # clang-19 minimum on Linux (see the epoll-clang entry in build). No
        # -stdlib=libc++: LLVM 19's libc++ still hides std::stop_token behind
        # _LIBCPP_HAS_NO_EXPERIMENTAL_STOP_TOKEN (CI-proven with both 18 and
        # 19; the android job describes the same gate), while libstdc++ ships
        # the complete library — exactly what epoll-clang already validates.
        run: sudo apt-get update && sudo apt-get install -y clang-19 libssl-dev zlib1g-dev
      - name: Configure with libFuzzer
        env:
          CFLAGS: -fsanitize=address,undefined,fuzzer-no-link -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined,fuzzer-no-link -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined,fuzzer-no-link
        run: >
          python scripts/ci/dependency_session.py -- cmake -S . -B build/fuzz -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-19
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
          -DMIRA_BUILD_FUZZERS=ON -DMIRA_ENABLE_WEBSOCKET=ON
          -DMIRA_ENABLE_HTTP2=ON -DMIRA_ENABLE_HTTP3=ON
      - name: Build
        run: python scripts/ci/dependency_session.py -- cmake --build build/fuzz --parallel
      - name: Ordinary tests with instrumented parser libraries
        run: python scripts/ci/dependency_session.py -- ctest --no-tests=error --test-dir build/fuzz --output-on-failure
      - name: Smoke fuzz (60s cap per harness)
        run: >
          python scripts/ci/dependency_session.py --environment build/fuzz/forgedeps-environment.json -- ./build/fuzz/fuzz/fuzz_http_parser
          -max_total_time=60 -max_len=1024 -rss_limit_mb=2560
          fuzz/corpus/http_parser &&
          python scripts/ci/dependency_session.py --environment build/fuzz/forgedeps-environment.json -- ./build/fuzz/fuzz/fuzz_response_parser
          -max_total_time=60 -max_len=1024 -rss_limit_mb=2560
          fuzz/corpus/response_parser &&
          python scripts/ci/dependency_session.py --environment build/fuzz/forgedeps-environment.json -- ./build/fuzz/fuzz/fuzz_ws_parser
          -max_total_time=60 -max_len=8192 -rss_limit_mb=2560 &&
          python scripts/ci/dependency_session.py --environment build/fuzz/forgedeps-environment.json -- ./build/fuzz/fuzz/fuzz_ws_handshake
          -max_total_time=60 -max_len=16384 -rss_limit_mb=2560 &&
          python scripts/ci/dependency_session.py --environment build/fuzz/forgedeps-environment.json -- ./build/fuzz/fuzz/fuzz_ws_compression
          -max_total_time=60 -max_len=4096 -rss_limit_mb=2560 &&
          python scripts/ci/dependency_session.py --environment build/fuzz/forgedeps-environment.json -- ./build/fuzz/fuzz/fuzz_mqtt_packet
          -max_total_time=60 -max_len=4096 -rss_limit_mb=2560 &&
          python scripts/ci/dependency_session.py --environment build/fuzz/forgedeps-environment.json -- ./build/fuzz/fuzz/fuzz_socks_handshake
          -max_total_time=60 -max_len=4096 -rss_limit_mb=2560 &&
          python scripts/ci/dependency_session.py --environment build/fuzz/forgedeps-environment.json -- ./build/fuzz/fuzz/fuzz_dns_message
          -max_total_time=60 -max_len=4096 -rss_limit_mb=2560 &&
          python scripts/ci/dependency_session.py --environment build/fuzz/forgedeps-environment.json -- ./build/fuzz/fuzz/fuzz_http2_session
          -max_total_time=60 -max_len=16384 -rss_limit_mb=2560 fuzz/corpus/http2_session &&
          python scripts/ci/dependency_session.py --environment build/fuzz/forgedeps-environment.json -- ./build/fuzz/fuzz/fuzz_http3_engine
          -max_total_time=60 -max_len=8192 -rss_limit_mb=2560 fuzz/corpus/http3_engine

  # Run the official RFC6455 and RFC7692 corpus against both roles.
  websocket-conformance:
    needs: discipline
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install WebSocket build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Configure and build both conformance harnesses
        run: |
          cmake -S . -B build/autobahn -DCMAKE_BUILD_TYPE=Release -DMIRA_ENABLE_WEBSOCKET=ON
          cmake --build build/autobahn --parallel --target mira_ws_autobahn_server mira_ws_autobahn_client
      - name: Run official Autobahn client and server cases
        run: >
          python3 scripts/ci/run_autobahn.py
          --server build/autobahn/mira_ws_autobahn_server
          --client build/autobahn/mira_ws_autobahn_client
          --runtime docker --compression --fail-non-strict --output build/autobahn-results --timeout 2400
      - name: Preserve complete conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: websocket-autobahn-results
          path: build/autobahn-results
          if-no-files-found: error

  # Optional protocol engines (nghttp2 / ngtcp2 / nghttp3) with their
  # dependencies built from pinned, hash-verified sources by the same
  # script a developer would run locally. This job covers POSIX; the TLS
  # and MinGW jobs above exercise the Windows H2/H3 dependency builds.
  protocols:
    needs: discipline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install forgedeps
        run: |
          python3 -m pip install --break-system-packages -r requirements-build.txt
          python3 -m forgedeps init "${{ env.FORGEDEPS_HOME }}"
      - name: Install protocol toolchain on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev g++-14 mosquitto
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          # mqtt.interop must reach the third-party broker, not skip it.
          echo "MIRA_REQUIRE_MOSQUITTO=1" >> "$GITHUB_ENV"
      - name: Locate OpenSSL on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          brew list mosquitto >/dev/null 2>&1 || brew install mosquitto
          echo "MIRA_REQUIRE_MOSQUITTO=1" >> "$GITHUB_ENV"
      - name: Configure with TLS, HTTP/2 and HTTP/3
        shell: bash
        run: >
          python scripts/ci/dependency_session.py -- cmake -S . -B build/protocols -DCMAKE_BUILD_TYPE=Debug
          -DMIRA_ENABLE_TLS=ON -DMIRA_ENABLE_WEBSOCKET=ON -DMIRA_ENABLE_DNSSEC=ON
          -DMIRA_ENABLE_HTTP2=ON
          -DMIRA_ENABLE_HTTP3=ON -DMIRA_BUILD_BENCH=ON
          -DCMAKE_INSTALL_INCLUDEDIR=include/mira-sdk
      - name: Build
        run: python scripts/ci/dependency_session.py -- cmake --build build/protocols --parallel
      - name: Build independent HTTP3 curl from the selected protocol graph
        run: python3 scripts/ci/build_interop_curl.py --environment build/protocols/forgedeps-environment.json
      - name: Report independent HTTP/3 client
        run: '"$(cat build/interop-curl/binary.txt)" --version'
      - name: Test POSIX protocols (Windows H2/H3 are not runtime-validated here)
        run: python scripts/ci/dependency_session.py -- ctest --no-tests=error --test-dir build/protocols --output-on-failure
      - name: Require independent HTTP3 interoperability
        run: >
          python scripts/ci/dependency_session.py --environment build/protocols/forgedeps-environment.json --environment build/interop-curl/environment.json -- python scripts/ci/check_h3_interop.py build/protocols/mira_h3_server
          --strict --curl "$(cat build/interop-curl/binary.txt)"
          --openssl openssl
      - name: Build independent aioquic validation environment
        run: |
          python3 -m venv build/aioquic-venv
          build/aioquic-venv/bin/python -m pip install aioquic==1.3.0
      - name: Verify independent H3 early data and Extended CONNECT
        run: >
          python scripts/ci/dependency_session.py --environment build/protocols/forgedeps-environment.json -- build/aioquic-venv/bin/python scripts/ci/check_h3_aioquic.py
          --require-connect-204
          --server build/protocols/mira_h3_advanced_peer
          --certificate build/protocols/modules/quic/tests/cert.pem
          --key build/protocols/modules/quic/tests/key.pem
          --output build/aioquic-interop.json
      - name: Preserve independent stack evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aioquic-interop-${{ matrix.os }}
          path: build/aioquic-interop.json
          if-no-files-found: error
      - name: Require independent Retry interoperability
        run: >
          python scripts/ci/dependency_session.py --environment build/protocols/forgedeps-environment.json --environment build/interop-curl/environment.json -- python scripts/ci/check_h3_interop.py build/protocols/mira_h3_multi_server
          --strict --multi-retry --curl "$(cat build/interop-curl/binary.txt)"
          --openssl openssl
      - name: Real UDP Retry and network-fault smoke
        run: >
          python scripts/ci/dependency_session.py --environment build/protocols/forgedeps-environment.json -- python scripts/bench/run_h3_soak.py --binary build/protocols/bench/bench_h3_soak
          --certificate build/protocols/modules/quic/tests/cert.pem
          --key build/protocols/modules/quic/tests/key.pem
          --duration-seconds 20 --seed 20260928 --clients 3 --requests 4
          --output build/h3-fault-smoke.json
      - name: Preserve fault-smoke measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h3-fault-smoke-${{ matrix.os }}
          path: build/h3-fault-smoke.json
          if-no-files-found: warn
      - name: Installed protocol package and component isolation
        run: python scripts/ci/dependency_session.py -- python scripts/ci/check_install_consumer.py --build-dir build/protocols
      - name: Configure HTTP3 without HTTP2 or NGHTTP2 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/mira-http3-only.cmake" <<'EOF'
          set(CMAKE_DISABLE_FIND_PACKAGE_NGHTTP2 TRUE CACHE BOOL "Forbid NGHTTP2 discovery in the HTTP3-only build")
          EOF
          python scripts/ci/dependency_session.py -- cmake -S . -B build/http3-only -C "$RUNNER_TEMP/mira-http3-only.cmake" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMIRA_ENABLE_HTTP3=ON -DMIRA_ENABLE_HTTP2=OFF -DMIRA_ENABLE_TLS=OFF
      - name: Build and test HTTP3-only (Linux)
        if: runner.os == 'Linux'
        run: |
          python scripts/ci/dependency_session.py -- cmake --build build/http3-only --parallel
          python scripts/ci/dependency_session.py -- ctest --no-tests=error --test-dir build/http3-only --output-on-failure
          python scripts/ci/dependency_session.py -- python scripts/ci/check_install_consumer.py --build-dir build/http3-only --expect-http3-only

  # Mobile targets cross-compile only; no runner executes them. Keeping them in
  # CI catches the usual breakage — a POSIX assumption that does not hold on a
  # sandboxed platform — without pretending the tests ran.
  ios:
    needs: discipline
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure for iOS
        run: >
          cmake -S . -B build/ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64
          -DMIRA_BUILD_TESTS=OFF
      - name: Build all non-TLS libraries (no target OpenSSL configured)
        run: cmake --build build/ios --config Debug

  android:
    needs: discipline
    runs-on: ubuntu-24.04
    env:
      # Pinned rather than `$ANDROID_NDK_ROOT`, which is whichever NDK the
      # runner image happens to default to. `std::stop_token` is gated behind
      # `_LIBCPP_HAS_NO_EXPERIMENTAL_STOP_TOKEN` in the libc++ that NDK 27 and
      # 28 ship (LLVM 18 and 19); LLVM 20 removed the gate. So the default NDK
      # cannot build this library at any API level, and the version is a real
      # requirement rather than an incidental detail.
      MIRA_NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the pinned NDK
        run: >
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          --install "ndk;$MIRA_NDK_VERSION"
      - name: Configure with NDK
        run: >
          cmake -S . -B build/android
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/$MIRA_NDK_VERSION/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
          -DMIRA_BUILD_TESTS=OFF
      - name: Build all non-TLS libraries (no target OpenSSL configured)
        run: cmake --build build/android --parallel
